name: Deploy Staging

on:
  push:
    branches: ["staging"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ① 秘密鍵を書き出し & known_hosts 登録（CRLF/改行救済つき）
      - name: Prepare SSH (write key & known_hosts)
        run: |
          set -e
          install -m 700 -d ~/.ssh
          # Secretsの鍵を書き出し
          printf "%s" "${{ secrets.X_SSH_KEY }}" > ~/.ssh/id_xserver || true
          # もし \n が文字列で来たら実改行へ、WindowsのCRLFも除去
          sed -i 's/\\n/\n/g' ~/.ssh/id_xserver || true
          sed -i 's/\r$//' ~/.ssh/id_xserver || true
          chmod 600 ~/.ssh/id_xserver
          # 鍵の健全性チェック（壊れていたら理由を出して終了）
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null 2>keycheck.err || (echo "❌ Invalid private key in X_SSH_KEY"; cat keycheck.err; exit 1)
          # 接続先ホスト鍵を登録
          ssh-keyscan -p ${{ secrets.X_PORT }} ${{ secrets.X_HOST }} >> ~/.ssh/known_hosts

      # ② 接続テスト
      - name: Test SSH connectivity
        run: |
          ssh -o IdentitiesOnly=yes -o BatchMode=yes \
              -p ${{ secrets.X_PORT }} -i ~/.ssh/id_xserver \
              ${{ secrets.X_USER }}@${{ secrets.X_HOST }} "echo OK && exit"

      # ③ scpを使わず、SSH経由で /tmp に plugin-lock.txt を生成
      - name: Create plugin-lock.txt remotely (no scp)
        run: |
          CONTENT=$(base64 -w0 plugin-lock.txt)
          ssh -p ${{ secrets.X_PORT }} -i ~/.ssh/id_xserver \
            ${{ secrets.X_USER }}@${{ secrets.X_HOST }} \
            "echo $CONTENT | base64 -d > /tmp/plugin-lock.txt && wc -l /tmp/plugin-lock.txt && head -n 3 /tmp/plugin-lock.txt"

      # ④ テーマ同期（./theme/ → サーバの THEME_PATH_STAGING 配下）
      - name: Sync Theme to STAGING
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.X_PORT }} -i ~/.ssh/id_xserver" \
            ./theme/ \
            "${{ secrets.X_USER }}@${{ secrets.X_HOST }}:${{ secrets.THEME_PATH_STAGING }}/"

      # ⑤ WPパスの健全性チェック（任意だけど安心）
      - name: Sanity check WP path
        run: |
          ssh -p ${{ secrets.X_PORT }} -i ~/.ssh/id_xserver \
            ${{ secrets.X_USER }}@${{ secrets.X_HOST }} \
            "ls -la '${{ secrets.WP_PATH_STAGING }}' && wp --path='${{ secrets.WP_PATH_STAGING }}' core is-installed && echo 'WP OK'"

      # ⑥ WP-CLIでロック適用（--path で確実にそのWPを操作）
      - name: Apply plugin lock (STG)
        run: |
          ssh -p ${{ secrets.X_PORT }} -i ~/.ssh/id_xserver ${{ secrets.X_USER }}@${{ secrets.X_HOST }} \
            bash -s -- "${{ secrets.WP_PATH_STAGING }}" <<'EOSSH'
              set -e
              WP_PATH="$1"
              cd "$WP_PATH"

              # ロックに書いたプラグインをインストール/更新/有効化
              while IFS= read -r line; do
                [[ -z "$line" || "$line" =~ ^# ]] && continue
                slug="${line%@*}"; ver="${line#*@}"
                if [[ "$ver" =~ \.zip$ || "$ver" =~ ^https?:// ]]; then
                  wp --path="$WP_PATH" plugin install "$ver" --force --activate
                else
                  if wp --path="$WP_PATH" plugin is-installed "$slug"; then
                    wp --path="$WP_PATH" plugin update "$slug" --version="$ver" --force
                    wp --path="$WP_PATH" plugin activate "$slug" || true
                  else
                    wp --path="$WP_PATH" plugin install "$slug" --version="$ver" --activate
                  fi
                fi
              done < /tmp/plugin-lock.txt

              # ロック外は無効化（削除は慣れてから）
              mapfile -t keep < <(grep -vE '^\s*#|^\s*$' /tmp/plugin-lock.txt | sed 's/@.*$//' | sort -u)
              mapfile -t installed < <(wp --path="$WP_PATH" plugin list --field=name | sort -u)
              for p in "${installed[@]}"; do
                skip=
                for k in "${keep[@]}"; do [[ "$p" == "$k" ]] && skip=1 && break; done
                [[ -n "$skip" ]] && continue
                wp --path="$WP_PATH" plugin deactivate "$p" || true
              done
EOSSH
